<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VP ASSOCIATES</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--line:#2b2b2b;--mut:#8c8c8c}
*{box-sizing:border-box;margin:0}
body{background:#000;color:#fff;font:300 15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
#bg:before{content:"";position:absolute;inset:-60px;background:linear-gradient(#161616 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,#161616 1px,transparent 1px) 0 0/56px 56px;animation:drift 24s linear infinite}
#bg i{position:absolute;left:50%;top:50%;border:1px dashed #333;border-radius:50%;transform:translate(-50%,-50%);animation:spin 50s linear infinite}
#bg i:nth-child(2){border-style:solid;border-color:#222;animation-direction:reverse;animation-duration:70s}
#bg i:nth-child(3){border-color:#444;animation-duration:35s}
@keyframes drift{to{transform:translate(56px,56px)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@keyframes letter{from{opacity:0;transform:translateY(.6em);filter:blur(6px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(420px,100%);padding:48px 38px;background:rgba(0,0,0,.78);border:1px solid #3a3a3a;backdrop-filter:blur(6px);animation:rise 1s .9s both}
.card.bad{animation:shake .4s}
h1{font-size:clamp(34px,8vw,52px);letter-spacing:.14em;text-align:center;line-height:1.1}
h1 span{display:inline-block;animation:letter .9s both}
.sub{text-align:center;color:var(--mut);margin:10px 0 36px;letter-spacing:.06em}
label{display:block;color:var(--mut);font-size:13px;margin-top:22px}
input,select{width:100%;background:none;border:0;border-bottom:1px solid #555;color:#fff;font:inherit;padding:8px 0;outline:0;transition:border-color .3s}
input:focus,select:focus{border-color:#fff}
select option{background:#000}
button{cursor:pointer;font:500 14px Inter,sans-serif;background:#fff;color:#000;border:1px solid #fff;padding:12px 22px;transition:.3s}
button:hover,button:focus-visible{background:#000;color:#fff;outline:0}
button.ghost{background:none;color:#fff;border-color:#555}
button.ghost:hover{border-color:#fff}
#lf button{width:100%;margin-top:34px}
#err{color:#fff;min-height:22px;margin-top:14px;font-size:13px;text-align:center}
#app{display:none;max-width:980px;margin:0 auto;padding:22px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line);animation:rise .7s both}
header .serif{font-size:26px;letter-spacing:.12em;font-weight:700}
nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav button.on{background:#fff;color:#000}
.who{color:var(--mut);font-size:13px;margin-right:6px}
section{display:none;margin-top:24px}
section.on{display:block;animation:rise .5s both}
#msgs{height:55vh;overflow-y:auto;border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:75%;padding:10px 14px;border:1px solid #444;position:relative;animation:pop .35s both}
.m.me{align-self:flex-end;background:#fff;color:#000}
.m small{color:var(--mut);font-size:11px}.m.me small{color:#555}
.m p{margin:2px 0;word-break:break-word}
.m a{position:absolute;top:4px;right:8px;cursor:pointer;font-size:12px}
.row{display:flex;gap:10px;margin-top:14px}.row input{border:1px solid #555;padding:11px 12px}
table{width:100%;border-collapse:collapse;margin-top:22px}
td,th{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
th{color:var(--mut);font-size:13px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;align-items:end}
h2{font-size:24px;margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="bg"><i style="width:520px;height:520px"></i><i style="width:760px;height:760px"></i><i style="width:1040px;height:1040px"></i></div>

<div id="login"><form class="card" id="lf" autocomplete="off">
<h1 class="serif" id="t"></h1><p class="sub">Advocates, Calicut. Staff access only.</p>
<label for="u">Username</label><input id="u" required autocapitalize="off">
<label for="p">Password</label><input id="p" type="password" required>
<button>Sign in</button><button type="button" class="ghost" id="setup" style="display:none;margin-top:12px">First-time setup</button><div id="err" role="alert"></div></form></div>

<div id="app">
<header><span class="serif">VP ASSOCIATES</span>
<nav><span class="who" id="who"></span><button class="on" data-t="chat">Messages</button><button class="ghost" data-t="cases">Cases</button><button class="ghost" data-t="tasks">Tasks</button><button class="ghost" data-t="clients">Clients</button><button class="ghost" data-t="admin" id="tabA">Admin</button><button class="ghost" id="out">Sign out</button></nav></header>
<section id="chat" class="on"><div id="msgs"></div>
<form class="row" id="mf"><input id="mt" placeholder="Write a message to the team" required><button>Send</button></form></section>
<section id="admin"><h2 class="serif">Team access</h2>
<form class="f" id="af"><div><label for="nu">Username</label><input id="nu" required></div>
<div><label for="np">Password (min 6 characters)</label><input id="np" type="password" minlength="6" required></div>
<div><label for="nr">Role</label><select id="nr"><option>admin</option><option>advocate</option><option>clerk</option><option>junior</option></select></div>
<button>Create user</button></form><div id="aerr" class="sub" style="text-align:left"></div>
<table><thead><tr><th>Username</th><th>Role</th><th></th></tr></thead><tbody id="ut"></tbody></table>
<div class="row"><button class="ghost" id="clr">Delete all messages</button></div></section>
</div>

<script type="module">
const cfg={apiKey:"AIzaSyCxTFDZigtFc0OckILdjDm17xvQ1jSXcNQ",authDomain:"vp-associates-77.firebaseapp.com",projectId:"vp-associates-77",storageBucket:"vp-associates-77.firebasestorage.app",messagingSenderId:"851343457275",appId:"1:851343457275:web:dc63f221d2c94cfba0695e"};
const demo=cfg.apiKey.startsWith("YOUR"); // demo = in-memory preview only; sign in as SAHL / OP77
const em=u=>u.trim().toLowerCase()+"@vpassociates.example.com";
let api;
if(demo){
 const U=[{id:"1",username:"SAHL",pw:"OP77",role:"admin"}],M=[];let sub=()=>{};
 api={async login(u,p){const x=U.find(a=>a.username.toLowerCase()==u.trim().toLowerCase()&&a.pw==p);if(!x)throw 0;return x},
 async out(){},chat(cb){sub=cb;cb(M)},
 async send(t,me){M.push({id:""+Math.random(),text:t,user:me.username,role:me.role,ts:Date.now()});sub(M)},
 async delMsg(id){M.splice(M.findIndex(m=>m.id==id),1);sub(M)},async clear(){M.length=0;sub(M)},
 D:{cases:[],tasks:[],clients:[]},S:{},
 list(k,cb){this.S[k]=cb;cb(this.D[k])},
 async put(k,o){this.D[k].push({id:""+Math.random(),...o});this.S[k](this.D[k])},
 async upd(k,id,p){Object.assign(this.D[k].find(x=>x.id==id),p);this.S[k](this.D[k])},
 async rm(k,id){const a=this.D[k];a.splice(a.findIndex(x=>x.id==id),1);this.S[k](a)},
 async users(){return[...U]},
 async add(u,p,r){if(U.some(a=>a.username.toLowerCase()==u.trim().toLowerCase()))throw 0;U.push({id:""+Math.random(),username:u.trim(),pw:p,role:r})},
 async del(id){U.splice(U.findIndex(a=>a.id==id),1)}};
}else{
 const b="https://www.gstatic.com/firebasejs/11.0.2/";
 const[{initializeApp},A,F]=await Promise.all([import(b+"firebase-app.js"),import(b+"firebase-auth.js"),import(b+"firebase-firestore.js")]);
 const app=initializeApp(cfg),auth=A.getAuth(app),db=F.getFirestore(app),sec=A.getAuth(initializeApp(cfg,"sec"));
 api={async login(u,p){const c=await A.signInWithEmailAndPassword(auth,em(u),p);const s=await F.getDoc(F.doc(db,"users",c.user.uid));
  if(!s.exists()){await A.signOut(auth);throw 0}return{id:c.user.uid,...s.data()}},
 list(k,cb){F.onSnapshot(F.collection(db,k),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))))},
 put:(k,o)=>F.addDoc(F.collection(db,k),o),
 upd:(k,id,p)=>F.updateDoc(F.doc(db,k,id),p),
 rm:(k,id)=>F.deleteDoc(F.doc(db,k,id)),
 async setup(u,p){if(u.trim().toLowerCase()!="sahl")throw 0;let c;
  try{c=await A.createUserWithEmailAndPassword(auth,em(u),p)}catch(e){if(e.code!="auth/email-already-in-use")throw e;c=await A.signInWithEmailAndPassword(auth,em(u),p)}
  await F.setDoc(F.doc(db,"users",c.user.uid),{username:"SAHL",role:"admin"});return{id:c.user.uid,username:"SAHL",role:"admin"}},
 out:()=>A.signOut(auth),
 chat(cb){F.onSnapshot(F.query(F.collection(db,"messages"),F.orderBy("ts","desc"),F.limit(100)),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})).reverse()))},
 send:(text,me)=>F.addDoc(F.collection(db,"messages"),{text,user:me.username,role:me.role,uid:me.id,ts:Date.now()}),
 delMsg:id=>F.deleteDoc(F.doc(db,"messages",id)),
 async clear(){const s=await F.getDocs(F.collection(db,"messages"));await Promise.all(s.docs.map(d=>F.deleteDoc(d.ref)))},
 async users(){return(await F.getDocs(F.collection(db,"users"))).docs.map(d=>({id:d.id,...d.data()}))},
 async add(u,p,r){const c=await A.createUserWithEmailAndPassword(sec,em(u),p);await F.setDoc(F.doc(db,"users",c.user.uid),{username:u.trim(),role:r});await A.signOut(sec)},
 del:id=>F.deleteDoc(F.doc(db,"users",id))};
}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me;
$("#t").innerHTML=[..."VP ASSOCIATES"].map((c,i)=>`<span style="animation-delay:${.15+i*.07}s">${c==" "?"&nbsp;":c}</span>`).join("");
$("#lf").onsubmit=async e=>{e.preventDefault();$("#err").textContent="";
 try{me=await api.login($("#u").value,$("#p").value);start()}
 catch{$("#err").textContent="Sign-in failed. Check your username and password.";const c=$(".card");c.classList.remove("bad");void c.offsetWidth;c.classList.add("bad")}};
if(api.setup)$("#setup").style.display="block";
$("#setup").onclick=async()=>{$("#err").textContent="";
 try{me=await api.setup($("#u").value,$("#p").value);start()}
 catch{$("#err").textContent="Setup failed. Use username SAHL and a password of 6 or more characters."}};
const MODS={
 cases:{h:"Case diary",f:[["title","Case title and number"],["court","Court"],["hearing","Next hearing","date"],["notes","Notes"]],s:"hearing"},
 tasks:{h:"Tasks",f:[["task","Task"],["to","Assigned to","user"],["due","Due date","date"]],s:"due",done:1},
 clients:{h:"Clients",f:[["name","Name"],["phone","Phone"],["notes","Notes"]],s:"name"}};
const data={};
for(const k in MODS){const m=MODS[k],s=document.createElement("section");s.id=k;
 s.innerHTML=`<h2 class="serif">${m.h}</h2><form class="f" data-k="${k}">${m.f.map(([n,l,t])=>`<div><label>${l}${t=="user"?`<select name="${n}" class="us"></select>`:`<input name="${n}"${t=="date"?' type="date"':""}${n==m.f[0][0]?" required":""}>`}</label></div>`).join("")}<button>Add</button></form><div style="overflow-x:auto"><table><thead><tr>${m.f.map(f=>`<th>${f[1]}</th>`).join("")}<th></th></tr></thead><tbody id="b-${k}"></tbody></table></div>`;
 $("#app").append(s)}
function fillSel(l){document.querySelectorAll(".us").forEach(s=>s.innerHTML=l.map(x=>`<option>${esc(x.username)}</option>`).join(""))}
function draw(k,l){const m=MODS[k];data[k]=l;l.sort((a,b)=>(a[m.s]||"~").localeCompare(b[m.s]||"~"));
 $("#b-"+k).innerHTML=l.map(x=>`<tr${x.done?' style="opacity:.4;text-decoration:line-through"':""}>${m.f.map(([n])=>`<td>${esc(x[n]||"")}</td>`).join("")}<td style="text-align:right;white-space:nowrap">${m.done?`<button class="ghost" data-c="${k}|${x.id}">${x.done?"Undo":"Done"}</button> `:""}${me.role=="admin"?`<button class="ghost" data-r="${k}|${x.id}">Delete</button>`:""}</td></tr>`).join("")||`<tr><td style="color:var(--mut)">Nothing here yet.</td></tr>`}
document.addEventListener("submit",async e=>{const k=e.target.dataset.k;if(!k)return;e.preventDefault();
 await api.put(k,{...Object.fromEntries(new FormData(e.target)),by:me.username,ts:Date.now()});e.target.reset()});
function start(){$("#login").style.display="none";$("#app").style.display="block";
 $("#who").textContent=me.username+" ("+me.role+")";$("#tabA").style.display=me.role=="admin"?"":"none";
 api.chat(m=>{$("#msgs").innerHTML=m.map(x=>`<div class="m ${x.user==me.username?"me":""}"><small>${esc(x.user)}, ${esc(x.role)}</small><p>${esc(x.text)}</p><small>${new Date(x.ts).toLocaleString()}</small>${me.role=="admin"?`<a data-m="${x.id}" title="Delete">✕</a>`:""}</div>`).join("");$("#msgs").scrollTop=1e9});
 for(const k in MODS)api.list(k,l=>draw(k,l));api.users().then(fillSel);
 if(me.role=="admin")users()}
async function users(){const l=await api.users();fillSel(l);
 $("#ut").innerHTML=l.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td style="text-align:right">${x.id==me.id?"You":`<button class="ghost" data-u="${x.id}">Remove</button>`}</td></tr>`).join("")}
document.addEventListener("click",async e=>{const t=e.target;
 if(t.dataset.c){const[k,id]=t.dataset.c.split("|");await api.upd(k,id,{done:!data[k].find(z=>z.id==id).done})}
 if(t.dataset.r&&confirm("Delete this entry? This cannot be undone.")){const[k,id]=t.dataset.r.split("|");await api.rm(k,id)}
 if(t.dataset.t){document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==t.dataset.t));document.querySelectorAll("nav button[data-t]").forEach(b=>{b.classList.toggle("on",b==t);b.classList.toggle("ghost",b!=t)})}
 if(t.dataset.m)await api.delMsg(t.dataset.m);
 if(t.dataset.u&&confirm("Remove this user? They lose access immediately.")){await api.del(t.dataset.u);users()}});
$("#mf").onsubmit=async e=>{e.preventDefault();const v=$("#mt").value.trim();if(v){$("#mt").value="";await api.send(v,me)}};
$("#af").onsubmit=async e=>{e.preventDefault();$("#aerr").textContent="";
 try{await api.add($("#nu").value,$("#np").value,$("#nr").value);e.target.reset();$("#aerr").textContent="User created.";users()}
 catch{$("#aerr").textContent="Could not create the user. The username may already exist."}};
$("#clr").onclick=async()=>{if(confirm("Delete every message? This cannot be undone."))await api.clear()};
$("#out").onclick=async()=>{await api.out();location.reload()};
</script></body></html>
